; KoreanPatch settings
[Fonts]
; 1 = draw Korean in every game font
KoreanInAllFonts=1
; 1 = each screen element uses the same engine font as in the English game
;     (menu font for menus and statistics, HUD name font for area and street names)
EnglishFontLayout=1

[Debug]
; 1 = when the game hangs or crashes, write where to GTAIV\KoreanPatch.log
Diagnostics=1
; 1 = write every distinct on-screen string to GTAIV\KoreanPatch_textlog.tsv
TextLog=0
; 1 = log the text the in-game web browser writes into its pages (KoreanPatch.log)
WebLog=0
; 1 = 30 seconds after start, write the game's code as it is in memory to GTAIV\KoreanPatch_code.bin
DumpCode=0

